<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#e0e0e0;font-family:system-ui,sans-serif;font-size:14px;padding:16px;min-height:100vh}
h2{font-size:13px;font-weight:500;color:#666;margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
.section{background:#1a1a1a;border:0.5px solid #2a2a2a;border-radius:12px;padding:16px;margin-bottom:16px}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.metric{background:#111;border-radius:8px;padding:12px;text-align:center}
.metric .label{font-size:11px;color:#555;margin-bottom:4px}
.metric .val{font-size:22px;font-weight:500;color:#e0e0e0}
.val.green{color:#4ade80}.val.blue{color:#60a5fa}.val.amber{color:#fbbf24}
.log-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.log-row input[type=number]{flex:1;min-width:80px}
input{background:#111;border:0.5px solid #333;border-radius:8px;padding:8px 12px;color:#e0e0e0;font-size:14px;outline:none}
input:focus{border-color:#555}
.btn{background:#222;border:0.5px solid #444;border-radius:8px;padding:8px 16px;color:#e0e0e0;cursor:pointer;font-size:13px;transition:background .15s;white-space:nowrap}
.btn:hover{background:#2a2a2a}
.btn.primary{background:#1d4ed8;border-color:#2563eb;color:#fff}
.btn.primary:hover{background:#2563eb}
.chart-wrap{position:relative;width:100%;height:260px}
#ptPopup{position:absolute;background:#1e1e1e;border:0.5px solid #444;border-radius:10px;padding:12px;min-width:160px;display:none;z-index:10}
#ptPopup .pt-info{font-size:12px;color:#888;margin-bottom:10px;line-height:1.6}
#ptPopup .pt-info span{color:#e0e0e0;font-weight:500}
.popup-btn{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;border:none;background:transparent;color:#ccc;cursor:pointer;font-size:13px;transition:background .1s}
.popup-btn:hover{background:#2a2a2a}
.popup-btn.del{color:#f87171}.popup-btn.del:hover{background:#2a0000}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:6px;cursor:pointer;background:#111;border:0.5px solid #333;color:#888;font-size:13px;transition:all .15s}
.tab.active{background:#1d4ed8;border-color:#2563eb;color:#fff}
.meal-table{width:100%;border-collapse:collapse}
.meal-table th{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:0.5px solid #2a2a2a;text-align:left}
.meal-table td{padding:6px 8px;border-bottom:0.5px solid #1a1a1a;vertical-align:top}
.meal-table tr:last-child td{border-bottom:none}
.day-col{font-size:12px;color:#888;font-weight:500;white-space:nowrap;width:36px}
.row-done .day-col{color:#4ade80}
.meal-cell{cursor:pointer;border-radius:6px;padding:4px 6px;transition:background .1s}
.meal-cell:hover{background:#222}
.meal-cell.done .meal-name{color:#4ade80;text-decoration:line-through}
.meal-name{font-size:12px;color:#ccc;line-height:1.3}
.meal-cal{font-size:11px;color:#555;margin-top:2px}
.day-total-cell{font-size:11px;color:#555;text-align:right;white-space:nowrap;width:80px}
textarea{width:100%;background:#0a0a0a;border:0.5px solid #333;border-radius:6px;padding:10px;color:#ccc;font-size:12px;resize:vertical;min-height:110px;outline:none;font-family:inherit;line-height:1.5}
textarea:focus{border-color:#555}
.btn-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
#verifyOut{display:none;margin-top:10px;background:#0a0a0a;border:0.5px solid #2a2a2a;border-radius:6px;padding:10px;font-size:12px;color:#9ca3af;white-space:pre-wrap;max-height:200px;overflow-y:auto;line-height:1.6}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e1e1e;border:0.5px solid #444;border-radius:8px;padding:10px 18px;font-size:13px;color:#e0e0e0;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{border-color:#7f1d1d;color:#f87171}
.toast.ok{border-color:#14532d;color:#4ade80}
</style>

<div id="metrics" class="metric-grid"></div>

<div class="section">
  <h2>Log Weight</h2>
  <div class="log-row">
    <input type="number" id="wInput" placeholder="e.g. 63.5" step="0.1" min="30" max="200"/>
    <input type="date" id="wDate" style="width:150px"/>
    <button class="btn primary" onclick="addWeight()">Add</button>
  </div>
  <div class="chart-wrap">
    <canvas id="wChart" role="img" aria-label="Weight progress line chart"></canvas>
    <div id="ptPopup">
      <div class="pt-info">Date: <span id="ppDate"></span><br>Weight: <span id="ppVal"></span> kg</div>
      <button class="popup-btn" onclick="closePopup()">Cancel</button>
      <button class="popup-btn del" onclick="deleteSelected()">Delete entry</button>
    </div>
  </div>
</div>

<div class="section">
  <h2>Meal Plan</h2>
  <div class="tabs" id="weekTabs"></div>
  <div style="overflow-x:auto">
    <table class="meal-table">
      <thead><tr>
        <th>Day</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th><th style="text-align:right">kcal</th>
      </tr></thead>
      <tbody id="mealBody"></tbody>
    </table>
  </div>
</div>

<div class="section">
  <h2>Add / Update Meal Plan</h2>
  <textarea id="mealInput" placeholder="Paste your meal plan table here (markdown table format supported)"></textarea>
  <div id="verifyOut"></div>
  <div class="btn-row">
    <button class="btn" id="verifyBtn" onclick="verifyCalories()">Verify calories</button>
    <button class="btn primary" onclick="updateCurrentWeek()">Update current week</button>
    <button class="btn" onclick="saveNewWeek()">Save as new week</button>
  </div>
</div>

<div class="section">
  <h2>Weight Correlation</h2>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <label style="font-size:12px;color:#666">From:</label>
    <input type="date" id="corrFrom" value="2025-04-01" style="width:150px" oninput="renderCorrelation()"/>
  </div>
  <div id="corrGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px"></div>
  <div style="position:relative;width:100%;height:180px"><canvas id="corrChart" role="img" aria-label="Weight change per interval"></canvas></div>
</div>

<div class="section">
  <h2>Export</h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" onclick="exportWeightCSV()">Export weight log CSV</button>
    <button class="btn" onclick="exportMealCSV()">Export meal plan CSV</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let GOAL = 58;
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let selectedPt = null, toastTimer = null;

function fmt(d){const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtShort(d){const p=d.split('-');return p[2]+'/'+p[1];}

function toast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show'+(type?' '+type:'');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.className='toast',3500);
}

function save(){
  try{
    localStorage.setItem('wt_weights',JSON.stringify(weights));
    localStorage.setItem('wt_weeks',JSON.stringify(weeks));
    localStorage.setItem('wt_goal',JSON.stringify(GOAL));
  }catch(e){toast('Could not save: '+e.message,'err');}
}

function load(){
  try{
    const w=localStorage.getItem('wt_weights');
    const wk=localStorage.getItem('wt_weeks');
    const g=localStorage.getItem('wt_goal');
    if(w) weights=JSON.parse(w);
    if(wk) weeks=JSON.parse(wk);
    if(g) GOAL=JSON.parse(g);
  }catch(e){toast('Could not load saved data','err');}
}

let weights=[];

function makeMeals(){
  return DAYS.map((d,i)=>i===6
    ?{day:d,free:true,meals:[]}
    :{day:d,free:false,meals:[
        {type:'B',name:'Greek yogurt & granola',cal:320,done:false},
        {type:'L',name:'Chicken & quinoa bowl',cal:480,done:false},
        {type:'D',name:'Grilled salmon & veggies',cal:520,done:false}
      ]}
  );
}

let weeks=[{label:'Week 1',days:makeMeals()}];
let currentWeek=0;

load();

function renderMetrics(){
  const cur=weights.length?weights[weights.length-1].v:0;
  const start=weights.length?weights[0].v:cur;
  const lost=+(start-cur).toFixed(1);
  const toGoal=+(cur-GOAL).toFixed(1);
  const pct=(start-GOAL)>0?Math.round(((start-cur)/(start-GOAL))*100):0;
  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="label">Current weight</div><div class="val">${cur} kg</div></div>
    <div class="metric"><div class="label">Lost so far</div><div class="val green">-${lost} kg</div></div>
    <div class="metric"><div class="label">To goal</div><div class="val amber">${toGoal} kg</div></div>
    <div class="metric" style="cursor:pointer" onclick="editGoal()" title="Click to edit">
      <div class="label">Goal weight ✎</div>
      <div class="val blue">${GOAL} kg</div>
    </div>`;
}

function editGoal(){
  const v=parseFloat(prompt('New goal weight (kg):',GOAL));
  if(isNaN(v)||v<30||v>200){toast('Invalid weight','err');return;}
  GOAL=v; save(); renderMetrics(); renderChart(); renderCorrelation();
  toast('Goal set to '+GOAL+' kg','ok');
}

let chart;
function renderChart(){
  const labels=weights.map(w=>fmtShort(w.d));
  const data=weights.map(w=>w.v);
  const ptColors=weights.map((_,i)=>i===selectedPt?'#f87171':'#60a5fa');
  const ptRadius=weights.map((_,i)=>i===selectedPt?9:5);
  if(chart){
    chart.data.labels=labels;
    chart.data.datasets[0].data=data;
    chart.data.datasets[0].pointBackgroundColor=ptColors;
    chart.data.datasets[0].pointRadius=ptRadius;
    chart.data.datasets[1].data=weights.map(()=>GOAL);
    chart.update('none'); return;
  }
  chart=new Chart(document.getElementById('wChart'),{
    type:'line',
    data:{labels,datasets:[
      {label:'Weight',data,borderColor:'#60a5fa',backgroundColor:'rgba(96,165,250,0.08)',
       pointBackgroundColor:ptColors,pointRadius:ptRadius,pointHoverRadius:9,tension:.3,fill:true},
      {label:'Goal',data:weights.map(()=>GOAL),borderColor:'#4ade80',borderDash:[6,3],pointRadius:0,borderWidth:1.5}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{
        title:c=>fmt(weights[c[0].dataIndex].d),
        label:c=>c.dataset.label+': '+c.parsed.y+' kg'
      }}},
      scales:{
        x:{grid:{color:'#1f1f1f'},ticks:{color:'#555',maxRotation:45,autoSkip:true,maxTicksLimit:14}},
        y:{grid:{color:'#1f1f1f'},ticks:{color:'#555',callback:v=>v+' kg'},min:GOAL-2}
      },
      onClick(evt,els){
        if(!els.length){closePopup();return;}
        const i=els[0].index; selectedPt=i; renderChart();
        const popup=document.getElementById('ptPopup');
        document.getElementById('ppDate').textContent=fmt(weights[i].d);
        document.getElementById('ppVal').textContent=weights[i].v;
        const wr=document.getElementById('wChart').parentElement.getBoundingClientRect();
        let x=evt.native.clientX-wr.left+10, y=evt.native.clientY-wr.top+10;
        if(x+170>wr.width) x=evt.native.clientX-wr.left-175;
        if(y+120>wr.height) y=evt.native.clientY-wr.top-125;
        popup.style.left=x+'px'; popup.style.top=y+'px'; popup.style.display='block';
      }
    }
  });
}

function closePopup(){document.getElementById('ptPopup').style.display='none';selectedPt=null;renderChart();}

function deleteSelected(){
  if(selectedPt===null){toast('No point selected','err');return;}
  const e=weights[selectedPt];
  weights.splice(selectedPt,1); selectedPt=null;
  document.getElementById('ptPopup').style.display='none';
  save(); renderMetrics(); renderChart(); renderCorrelation();
  toast('Deleted '+fmt(e.d)+' ('+e.v+' kg)','ok');
}

function addWeight(){
  const raw=document.getElementById('wInput').value.trim();
  if(!raw){toast('Enter a weight value','err');return;}
  const v=parseFloat(raw);
  if(isNaN(v)||v<30||v>200){toast('Weight must be 30–200 kg','err');return;}
  const dateEl=document.getElementById('wDate');
  const chosen=dateEl.value||new Date().toISOString().slice(0,10);
  const idx=weights.findIndex(w=>w.d===chosen);
  if(idx>=0){weights[idx].v=v;toast('Updated '+fmt(chosen)+' to '+v+' kg','ok');}
  else{weights.push({d:chosen,v});toast('Added '+v+' kg for '+fmt(chosen),'ok');}
  weights.sort((a,b)=>a.d.localeCompare(b.d));
  selectedPt=null; document.getElementById('wInput').value=''; dateEl.value='';
  save(); renderMetrics(); renderChart(); renderCorrelation();
}

function renderWeekTabs(){
  document.getElementById('weekTabs').innerHTML=weeks.map((w,i)=>
    `<div class="tab${i===currentWeek?' active':''}" onclick="switchWeek(${i})">${w.label}${i===currentWeek?' ✕':''}</div>`
  ).join('');
}

function switchWeek(i){
  if(i===currentWeek){
    if(weeks.length===1){toast('Cannot delete the only week','err');return;}
    if(!confirm('Delete '+weeks[i].label+'?'))return;
    weeks.splice(i,1); currentWeek=Math.min(currentWeek,weeks.length-1);
    save(); renderWeekTabs(); renderMeals(); toast('Week deleted','ok'); return;
  }
  currentWeek=i; renderWeekTabs(); renderMeals();
}

function renderMeals(){
  const wk=weeks[currentWeek];
  document.getElementById('mealBody').innerHTML=wk.days.map((d,di)=>{
    if(d.free)return`<tr><td class="day-col" style="color:#444">${d.day}</td><td colspan="4" style="color:#444;font-size:12px;padding:10px 8px">Free day</td></tr>`;
    const allDone=d.meals.every(m=>m.done);
    const doneCal=d.meals.filter(m=>m.done).reduce((s,m)=>s+m.cal,0);
    const totalCal=d.meals.reduce((s,m)=>s+m.cal,0);
    return`<tr class="${allDone?'row-done':''}">
      <td class="day-col">${d.day}</td>
      ${d.meals.map((m,mi)=>`<td><div class="meal-cell${m.done?' done':''}" onclick="toggleMeal(${di},${mi})">
        <div class="meal-name">${m.done?'✕ ':''}${m.name||'—'}</div>
        <div class="meal-cal">${m.cal} kcal</div>
      </div></td>`).join('')}
      <td class="day-total-cell">${doneCal}/${totalCal} kcal</td>
    </tr>`;
  }).join('');
}

function toggleMeal(di,mi){weeks[currentWeek].days[di].meals[mi].done^=1;save();renderMeals();}

function fixFreeDay(){
  weeks.forEach(w=>w.days.forEach((d,i)=>{
    d.free=i===6; if(i===6)d.meals=[];
    if(i!==6&&(!d.meals||!d.meals.length))d.meals=[
      {type:'B',name:'',cal:0,done:false},{type:'L',name:'',cal:0,done:false},{type:'D',name:'',cal:0,done:false}
    ];
  }));
}

function stripMd(s){return s.replace(/\*\*/g,'').replace(/\*/g,'').trim();}
function extractCal(s){const m=s.match(/→\s*\*?\*?(\d+)\s*kcal/i)||s.match(/(\d{3,4})\s*kcal/i);return m?parseInt(m[1]):0;}

function parseMealPlan(text){
  if(!text||!text.trim())return null;
  const lines=text.trim().split('\n').map(l=>l.trim()).filter(Boolean);
  const isTable=lines.some(l=>l.startsWith('|'));
  const result=DAYS.map((d,i)=>({day:d,free:i===6,meals:i===6?[]:[
    {type:'B',name:'',cal:0,done:false},{type:'L',name:'',cal:0,done:false},{type:'D',name:'',cal:0,done:false}
  ]}));
  const dayIdx={sun:0,sunday:0,mon:1,monday:1,tue:2,tuesday:2,wed:3,wednesday:3,thu:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
  if(isTable){
    let matched=0;
    for(const line of lines){
      if(!line.startsWith('|'))continue;
      const cells=line.split('|').map(c=>c.trim()).filter(Boolean);
      if(cells.length<4)continue;
      const dayRaw=stripMd(cells[0]).toLowerCase().replace(/\s*\(.*\)/,'').trim();
      const di=dayIdx[dayRaw];
      if(di===undefined)continue;
      if(di===6){result[6].free=true;result[6].meals=[];continue;}
      const b=stripMd(cells[1]),l=stripMd(cells[2]),dn=stripMd(cells[3]);
      if(b){result[di].meals[0].name=b;result[di].meals[0].cal=extractCal(b);matched++;}
      if(l){result[di].meals[1].name=l;result[di].meals[1].cal=extractCal(l);matched++;}
      if(dn){result[di].meals[2].name=dn;result[di].meals[2].cal=extractCal(dn);matched++;}
    }
    return matched>0?result:null;
  }
  let di=-1,matched=0;
  for(const line of lines){
    const lc=line.toLowerCase().replace(/[:\s\.\-]+$/,'').trim();
    if(dayIdx[lc]!==undefined){di=dayIdx[lc];continue;}
    if(di<0||di===6)continue;
    const cal=extractCal(line),clean=line.replace(/[\-–]\s*\d+\s*(kcal|cal)?/i,'').trim();
    const b=/^(breakfast|b\b)[:\s\-]+(.*)/i.exec(clean);
    const l=/^(lunch|l\b)[:\s\-]+(.*)/i.exec(clean);
    const d=/^(dinner|supper|d\b)[:\s\-]+(.*)/i.exec(clean);
    if(b&&b[2].trim()){result[di].meals[0].name=b[2].trim();result[di].meals[0].cal=cal;matched++;}
    else if(l&&l[2].trim()){result[di].meals[1].name=l[2].trim();result[di].meals[1].cal=cal;matched++;}
    else if(d&&d[2].trim()){result[di].meals[2].name=d[2].trim();result[di].meals[2].cal=cal;matched++;}
  }
  return matched>0?result:null;
}

async function verifyCalories(){
  const text=document.getElementById('mealInput').value.trim();
  if(!text){toast('Paste a meal plan first','err');return;}
  const btn=document.getElementById('verifyBtn'),box=document.getElementById('verifyOut');
  btn.textContent='Verifying…';btn.disabled=true;
  box.style.display='block';box.textContent='Checking calories…';
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,
        messages:[{role:'user',content:'You are a nutrition assistant. Verify or estimate calories for this meal plan. List each day with Breakfast/Lunch/Dinner and calories in brackets, plus a daily total. Be concise.\n\n'+text}]})
    });
    if(!resp.ok){const e=await resp.text();box.textContent='API error '+resp.status+': '+e.slice(0,120);toast('API error '+resp.status,'err');return;}
    const data=await resp.json();
    box.textContent=data.content?.map(c=>c.text||'').join('').trim()||'No response';
    toast('Done!','ok');
  }catch(e){box.textContent='Error: '+e.message;toast('Error: '+e.message,'err');}
  finally{btn.textContent='Verify calories';btn.disabled=false;}
}

function updateCurrentWeek(){
  const text=document.getElementById('mealInput').value.trim();
  if(!text){toast('Paste a meal plan first','err');return;}
  const parsed=parseMealPlan(text);
  if(!parsed){toast('Could not parse — check format','err');return;}
  weeks[currentWeek].days=parsed; save(); renderMeals(); toast(weeks[currentWeek].label+' updated!','ok');
}

function saveNewWeek(){
  const text=document.getElementById('mealInput').value.trim();
  if(!text){toast('Paste a meal plan first','err');return;}
  const parsed=parseMealPlan(text);
  if(!parsed){toast('Could not parse — check format','err');return;}
  const label='Week '+(weeks.length+1);
  weeks.push({label,days:parsed}); currentWeek=weeks.length-1;
  save(); renderWeekTabs(); renderMeals(); toast(label+' saved!','ok');
}

function renderCorrelation(){
  const from=document.getElementById('corrFrom')?.value||'2025-04-01';
  const filtered=weights.filter(w=>w.d>=from);
  const grid=document.getElementById('corrGrid');
  if(filtered.length<2){
    grid.innerHTML='<div style="color:#555;font-size:12px;grid-column:span 3">Need at least 2 entries in range</div>';
    if(window.corrChartObj){window.corrChartObj.destroy();window.corrChartObj=null;} return;
  }
  const vals=filtered.map(w=>w.v);
  const n=vals.length, first=vals[0], last=vals[n-1];
  const totalLoss=+(first-last).toFixed(2);
  const days=Math.max(1,Math.round((new Date(filtered[n-1].d)-new Date(filtered[0].d))/(864e5)));
  const perWeek=+((totalLoss/days)*7).toFixed(2);
  const diffs=[];
  for(let i=1;i<n;i++) diffs.push(+((vals[i-1]-vals[i])*1000).toFixed(0)); // grams, positive=loss
  const avgG=+(diffs.reduce((a,b)=>a+b,0)/diffs.length).toFixed(0);
  const weeksToGoal=perWeek>0?Math.ceil((last-GOAL)/perWeek):'—';
  grid.innerHTML=`
    <div class="metric"><div class="label">Total lost</div><div class="val green">-${totalLoss} kg</div></div>
    <div class="metric"><div class="label">Avg / week</div><div class="val blue">${perWeek} kg</div></div>
    <div class="metric"><div class="label">Avg per entry</div><div class="val ${avgG>=0?'green':'amber'}">${avgG>=0?'-':'+'}${Math.abs(avgG)}g</div></div>
    <div class="metric"><div class="label">Entries</div><div class="val">${n}</div></div>
    <div class="metric"><div class="label">Days tracked</div><div class="val">${days}</div></div>
    <div class="metric"><div class="label">Weeks to goal</div><div class="val amber">${weeksToGoal}</div></div>`;

  // Build bars: each interval split into 500g segments
  const barLabels=[], barData=[], barColors=[];
  for(let i=1;i<filtered.length;i++){
    const grams=Math.round((filtered[i-1].v-filtered[i].v)*1000);
    const lbl=fmtShort(filtered[i-1].d)+'→'+fmtShort(filtered[i].d);
    if(grams===0) continue;
    if(grams<0){
      // gain — single red bar
      barLabels.push(lbl); barData.push(Math.abs(grams)); barColors.push('#f87171');
    } else {
      // loss — split into 500g chunks
      let rem=grams;
      while(rem>0){
        const seg=Math.min(rem,500);
        barLabels.push(lbl); barData.push(seg); barColors.push('#4ade80');
        rem-=seg;
      }
    }
  }

  if(window.corrChartObj) window.corrChartObj.destroy();
  window.corrChartObj=new Chart(document.getElementById('corrChart'),{
    type:'bar',
    data:{labels:barLabels,datasets:[{
      label:'g',data:barData,backgroundColor:barColors,
      borderRadius:3,barThickness:14
    }]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{
        title:c=>c[0].label,
        label:c=>(barColors[c.dataIndex]==='#4ade80'?'-':'+')+(c.parsed.y)+'g'
      }}},
      scales:{
        x:{grid:{color:'#1f1f1f'},ticks:{color:'#555',font:{size:10},maxRotation:45,autoSkip:false}},
        y:{grid:{color:'#1f1f1f'},ticks:{color:'#555',stepSize:100,callback:v=>v+'g'},min:0,max:500}
      }
    }
  });
}

function exportWeightCSV(){
  if(!weights.length){toast('No weight data','err');return;}
  downloadCSV([['Date','Weight (kg)'],...weights.map(w=>[fmt(w.d),w.v])],'weight_log.csv');
  toast('Exported weight log','ok');
}

function exportMealCSV(){
  const rows=[['Week','Day','Meal','Description','Calories','Done']];
  const ml={B:'Breakfast',L:'Lunch',D:'Dinner'};
  weeks.forEach(w=>w.days.forEach(d=>{
    if(d.free){rows.push([w.label,d.day,'—','Free day','—','—']);return;}
    d.meals.forEach(m=>rows.push([w.label,d.day,ml[m.type],m.name,m.cal,m.done?'Yes':'No']));
  }));
  downloadCSV(rows,'meal_plan.csv'); toast('Exported meal plan','ok');
}

function downloadCSV(rows,filename){
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=filename; a.click();
}
